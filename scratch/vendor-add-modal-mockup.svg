    <text x="1088" y="516" fill="#5D5F5F" font-size="20">edit</text>
    <text x="1120" y="516" fill="#BA1A1A" font-size="20">delete</text>

    <rect x="526" y="556" width="622" height="70" rx="7" fill="#FFFFFF" stroke="#E4BEBA"/>
    <rect x="546" y="576" width="70" height="24" rx="12" fill="#F3F3F3"/>
    <text x="562" y="592" fill="#5D5F5F" font-size="11" font-weight="800">ใช้งาน</text>
    <text x="632" y="584" fill="#1A1C1C" font-size="15" font-weight="800">ที่อยู่ 2</text>
    <text x="632" y="606" fill="#5D5F5F" class="small">99/1 นิคมอุตสาหกรรมอมตะ ชลบุรี 20000</text>
    <text x="1088" y="600" fill="#5D5F5F" font-size="20">edit</text>
    <text x="1120" y="600" fill="#BA1A1A" font-size="20">delete</text>

