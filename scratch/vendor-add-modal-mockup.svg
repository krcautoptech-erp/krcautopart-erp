  <rect x="948" y="734" width="100" height="36" rx="5" fill="#FFFFFF" stroke="#E4BEBA"/>
  <text x="980" y="757" fill="#1A1C1C" font-size="14" font-weight="800">ยกเลิก</text>
  <rect x="1064" y="734" width="112" height="36" rx="5" fill="#AF101A"/>
  <text x="1090" y="757" fill="#FFFFFF" font-size="14" font-weight="800">บันทึกผู้ขาย</text>
