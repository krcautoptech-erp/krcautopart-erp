  <!-- Modal shell -->
  <rect x="78" y="42" width="1124" height="736" rx="10" fill="#FFFFFF" stroke="#E4BEBA"/>
  <rect x="78" y="42" width="1124" height="58" rx="10" fill="#FFFFFF"/>
  <line x1="78" y1="100" x2="1202" y2="100" stroke="#E4BEBA"/>

  <!-- Header -->
  <rect x="104" y="60" width="88" height="24" rx="4" fill="#AF101A"/>
  <text x="118" y="76" fill="#FFFFFF" font-size="12" font-weight="800">KRC ERP</text>
  <text x="210" y="78" fill="#1A1C1C" class="title">เพิ่มผู้ขาย / เจ้าหนี้</text>
  <text x="978" y="66" fill="#5D5F5F" class="tiny">VENDOR MASTER FORM</text>
  <text x="1018" y="84" fill="#AF101A" font-size="12" font-weight="800">ข้อมูลผู้ขายกลาง</text>
