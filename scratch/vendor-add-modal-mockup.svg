<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="820" fill="#2B2928" opacity="0.92"/>
  <style>
    text { font-family: Inter, "Noto Sans Thai", "Segoe UI", sans-serif; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; }
    .title { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
    .section { font-size: 15px; font-weight: 800; }
    .label { font-size: 12px; font-weight: 800; letter-spacing: .06em; }
    .value { font-size: 15px; font-weight: 600; }
    .small { font-size: 12px; font-weight: 600; }
    .tiny { font-size: 10px; font-weight: 800; letter-spacing: .12em; }
