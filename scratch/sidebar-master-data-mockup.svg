<svg width="980" height="760" viewBox="0 0 980 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="980" height="760" fill="#F8F4F2"/>
  <style>
    text { font-family: Inter, "Noto Sans Thai", "Segoe UI", sans-serif; }
    .brand { font-size: 21px; font-weight: 800; }
    .caption { font-size: 12px; font-weight: 600; }
    .nav { font-size: 14px; font-weight: 700; }
    .sub { font-size: 13px; font-weight: 650; }
    .title { font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
    .body { font-size: 14px; font-weight: 500; }
    .label { font-size: 11px; font-weight: 800; letter-spacing: .09em; }
  </style>

  <!-- App frame -->
  <rect x="36" y="32" width="908" height="696" rx="24" fill="#FFFFFF" stroke="#E5D7D3"/>

  <!-- Sidebar -->
  <rect x="36" y="32" width="250" height="696" rx="24" fill="#FFFFFF"/>
  <clipPath id="sidebarClip">
    <rect x="36" y="32" width="250" height="696" rx="24"/>
  </clipPath>
  <g clip-path="url(#sidebarClip)">
    <line x1="286" y1="32" x2="286" y2="728" stroke="#E5D7D3"/>
    <rect x="58" y="58" width="34" height="34" rx="8" fill="#B5121B"/>
    <text x="106" y="81" fill="#B5121B" class="brand">Industrial ERP</text>
    <text x="58" y="112" fill="#766B68" class="caption">ระบบจัดการทรัพยากร</text>

    <text x="58" y="158" fill="#9B8D89" class="label">MAIN MENU</text>

    <rect x="50" y="174" width="218" height="40" rx="10" fill="#FFFFFF"/>
    <text x="92" y="200" fill="#2B2422" class="nav">แดชบอร์ด</text>
    <text x="62" y="201" fill="#7A6F6C" font-size="20">dashboard</text>

    <!-- Master data group -->
    <rect x="50" y="224" width="218" height="188" rx="16" fill="#FBF7F6" stroke="#E8DAD6"/>
    <text x="66" y="252" fill="#2B2422" class="nav">ข้อมูลกลาง</text>
    <text x="232" y="252" fill="#9B8D89" font-size="18">expand_less</text>

    <rect x="64" y="268" width="190" height="34" rx="8" fill="#FFFFFF"/>
    <text x="94" y="290" fill="#615855" class="sub">ข้อมูลสินค้า</text>
    <text x="76" y="291" fill="#9B8D89" font-size="17">inventory_2</text>

    <rect x="64" y="308" width="190" height="36" rx="8" fill="#B5121B"/>
    <text x="94" y="331" fill="#FFFFFF" class="sub">คู่ค้า</text>
    <text x="76" y="332" fill="#FFFFFF" font-size="17">groups</text>

    <rect x="64" y="350" width="190" height="34" rx="8" fill="#FFFFFF"/>
    <text x="94" y="372" fill="#615855" class="sub">ตั้งค่าคู่ค้า</text>
    <text x="76" y="373" fill="#9B8D89" font-size="17">tune</text>

    <rect x="64" y="388" width="190" height="14" rx="7" fill="#FFFFFF"/>
    <text x="94" y="399" fill="#8A7F7B" font-size="11" font-weight="650">ตั้งค่าวัตถุดิบ</text>

    <rect x="50" y="426" width="218" height="40" rx="10" fill="#FFFFFF"/>
    <text x="92" y="452" fill="#2B2422" class="nav">การจัดซื้อ</text>
    <text x="62" y="453" fill="#7A6F6C" font-size="20">shopping_cart</text>

    <rect x="50" y="476" width="218" height="40" rx="10" fill="#FFFFFF"/>
    <text x="92" y="502" fill="#2B2422" class="nav">การผลิต</text>
    <text x="62" y="503" fill="#7A6F6C" font-size="20">factory</text>

    <rect x="50" y="526" width="218" height="40" rx="10" fill="#FFFFFF"/>
    <text x="92" y="552" fill="#2B2422" class="nav">HR</text>
    <text x="62" y="553" fill="#7A6F6C" font-size="20">badge</text>

    <rect x="50" y="576" width="218" height="40" rx="10" fill="#FFFFFF"/>
    <text x="92" y="602" fill="#2B2422" class="nav">บัญชี</text>
    <text x="62" y="603" fill="#7A6F6C" font-size="20">account_balance</text>

    <rect x="50" y="626" width="218" height="40" rx="10" fill="#FFFFFF"/>
    <text x="92" y="652" fill="#2B2422" class="nav">รายงาน</text>
    <text x="62" y="653" fill="#7A6F6C" font-size="20">assessment</text>
  </g>

  <!-- Main area -->
  <rect x="286" y="32" width="658" height="64" rx="0" fill="#FFFFFF"/>
  <line x1="286" y1="96" x2="944" y2="96" stroke="#E5D7D3"/>
  <rect x="316" y="52" width="310" height="28" rx="14" fill="#F2EAE7"/>
  <text x="340" y="70" fill="#766B68" class="caption">ค้นหาคู่ค้า, เจ้าหนี้, ลูกหนี้...</text>

  <rect x="286" y="96" width="658" height="46" fill="#F8F2F0"/>
  <rect x="316" y="106" width="116" height="32" rx="10" fill="#FFFFFF" stroke="#E5D7D3"/>
  <text x="338" y="127" fill="#766B68" class="caption">ข้อมูลสินค้า</text>
  <rect x="440" y="106" width="86" height="32" rx="10" fill="#FFF9F8" stroke="#B5121B"/>
  <text x="466" y="127" fill="#B5121B" class="caption">คู่ค้า</text>

  <text x="316" y="194" fill="#211A18" class="title">คู่ค้า</text>
  <text x="316" y="222" fill="#766B68" class="body">หน้ากลางสำหรับจัดการเจ้าหนี้และลูกหนี้ ใช้ข้อมูลตั้งค่าคู่ค้าเป็น Dropdown</text>

  <rect x="316" y="252" width="590" height="126" rx="16" fill="#FFFFFF" stroke="#E5D7D3"/>
  <text x="342" y="286" fill="#211A18" font-size="18" font-weight="800">เมนูในหน้า “คู่ค้า”</text>
  <rect x="342" y="310" width="160" height="42" rx="8" fill="#B5121B"/>
  <text x="382" y="337" fill="#FFFFFF" font-size="14" font-weight="800">เจ้าหนี้</text>
  <rect x="516" y="310" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#E5D7D3"/>
  <text x="556" y="337" fill="#2B2422" font-size="14" font-weight="800">ลูกหนี้</text>
  <rect x="690" y="310" width="190" height="42" rx="8" fill="#FFFFFF" stroke="#E5D7D3"/>
  <text x="724" y="337" fill="#2B2422" font-size="14" font-weight="800">เป็นทั้งสองแบบ</text>

  <rect x="316" y="406" width="590" height="220" rx="16" fill="#FFFFFF" stroke="#E5D7D3"/>
  <text x="342" y="440" fill="#211A18" font-size="18" font-weight="800">ถ้ากด “ตั้งค่าคู่ค้า”</text>
  <text x="342" y="464" fill="#766B68" class="body">รวมค่าที่ใช้เป็น Dropdown ไว้หน้าเดียว ไม่แตก Sidebar ให้รก</text>

  <g class="body">
    <rect x="342" y="492" width="160" height="36" rx="8" fill="#FAF7F6" stroke="#E8DAD6"/>
    <text x="364" y="515" fill="#2B2422">ประเภทเจ้าหนี้</text>
    <rect x="516" y="492" width="150" height="36" rx="8" fill="#FAF7F6" stroke="#E8DAD6"/>
    <text x="538" y="515" fill="#2B2422">กลุ่มเจ้าหนี้</text>
    <rect x="680" y="492" width="136" height="36" rx="8" fill="#FAF7F6" stroke="#E8DAD6"/>
    <text x="702" y="515" fill="#2B2422">เครดิตเทอม</text>

    <rect x="342" y="542" width="160" height="36" rx="8" fill="#FAF7F6" stroke="#E8DAD6"/>
    <text x="364" y="565" fill="#2B2422">วิธีชำระเงิน</text>
    <rect x="516" y="542" width="150" height="36" rx="8" fill="#FAF7F6" stroke="#E8DAD6"/>
    <text x="538" y="565" fill="#2B2422">ประเภทภาษี</text>
    <rect x="680" y="542" width="136" height="36" rx="8" fill="#FAF7F6" stroke="#E8DAD6"/>
    <text x="702" y="565" fill="#2B2422">หัก ณ ที่จ่าย</text>

    <rect x="342" y="592" width="160" height="36" rx="8" fill="#FAF7F6" stroke="#E8DAD6"/>
    <text x="364" y="615" fill="#2B2422">ผังบัญชี</text>
  </g>

  <rect x="316" y="656" width="590" height="42" rx="10" fill="#FFF5F4" stroke="#E7C8C5"/>
  <text x="342" y="682" fill="#B5121B" font-size="13" font-weight="800">แนวคิด:</text>
  <text x="410" y="682" fill="#3A302D" font-size="13" font-weight="600">Sidebar มีแค่ “คู่ค้า” และ “ตั้งค่าคู่ค้า” ส่วน 7 ค่าไปเป็น tab/card ด้านใน</text>
</svg>
