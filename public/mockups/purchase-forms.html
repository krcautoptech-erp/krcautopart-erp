<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRC — PR / PO / GR</title>
<style>
@font-face{font-family:krc;src:url('/fonts/SukhumvitSet-SemiBold.ttf')}*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#202630;font:15px krc,Tahoma,sans-serif}button,input,select{font:inherit}button{padding:9px 17px;background:white;border:1px solid #d4dae2;border-radius:5px;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #80b7ef;outline-offset:2px}.top{max-width:1240px;margin:24px auto 20px;padding:0 16px}.top p{font-size:14px;color:#67717e;margin:8px 0 16px}h1{font-size:21px;margin:0}.tabs{display:flex;gap:8px}.tabs [aria-pressed=true]{background:#282f39;color:white;border-color:#282f39}.modal{max-width:1210px;margin:0 auto 30px;background:white;border:1px solid #dbe0e7;border-radius:9px;overflow:hidden;box-shadow:0 15px 35px #222b3610}header{padding:17px 24px;border-bottom:1px solid #dfe4ea;display:flex;align-items:center;gap:20px}header strong{color:#b40d23;border-right:1px solid #dce1e7;padding-right:20px}h2{font-size:22px;margin:0}header small{margin-left:auto;color:#78828e}main{padding:20px 24px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;margin-bottom:22px}.field{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center;min-width:0}.field label{white-space:nowrap;color:#505964}.field em{color:#b80f23;font-style:normal}input,select{height:38px;padding:7px 10px;border:1px solid #d4dae2;border-radius:5px;width:100%;min-width:0;background:white;color:#28303a}input[readonly]{background:#f7f8fa;color:#66707a}.po .fields{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 22px}.po .field{grid-template-columns:100px minmax(0,1fr)}.po .wide{grid-column:span 2}.bar{display:flex;align-items:center;gap:12px;margin:0 0 12px}.bar h3{font-size:17px;margin:0 auto 0 0;white-space:nowrap}.bar input{max-width:330px}.bar button{white-space:nowrap;color:#b30c21}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:13px;color:#5f6976;font-weight:normal;border-top:1px solid #dce1e7;border-bottom:1px solid #dce1e7;padding:11px 8px;text-align:left;white-space:nowrap}td{padding:14px 8px;border-bottom:1px solid #e2e6ec;white-space:nowrap;vertical-align:middle}.product{white-space:normal;min-width:230px;line-height:1.6}.gr .product{min-width:200px}.right{text-align:right}.remark{margin-top:18px;display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center;color:#59636f}.bottom{display:grid;grid-template-columns:1fr 310px;gap:36px;margin-top:18px}.bottom .remark{align-self:start;margin:0;grid-template-columns:140px 1fr}.totals{display:grid;grid-template-columns:1fr auto;gap:6px 25px;font-size:14px}.totals strong{border-top:1px solid #dce1e7;padding-top:7px;font-size:16px}footer{padding:14px 24px;border-top:1px solid #dfe4ea;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.summary{margin-left:auto;margin-right:14px}.primary{background:#ba0e23;border-color:#ba0e23;color:white}.subtle{font-size:13px;color:#78828e}.lot{padding:6px 10px;color:#2479c7;white-space:nowrap}.qty{width:63px;height:34px;text-align:center}.notice{max-width:1210px;margin:0 auto;padding:0 16px;font-size:14px;color:#66707d}.delete{border:0;padding:4px;color:#b30d22}.warehouse{width:110px;font-size:14px}@media(max-width:1000px){.modal{margin:0 12px 20px}.po .fields{grid-template-columns:1fr 1fr}.po .wide{grid-column:auto}.po .field{grid-template-columns:120px 1fr}}@media(max-width:680px){.fields,.po .fields{grid-template-columns:1fr}.bar{flex-wrap:wrap}.bottom{grid-template-columns:1fr}main{padding:16px}.summary{margin-left:0}header{padding:16px;gap:10px}header strong{display:none}h2{font-size:20px}.field,.po .field{grid-template-columns:140px minmax(0,1fr)}}
</style>
<div class="top"><h1>ฟอร์มเอกสาร — ทิศทางเดียวกับใบเบิก</h1><p>Mockup • ชื่อกับช่องบรรทัดเดียวกัน • คงฟิลด์เดิม • ไม่บันทึกข้อมูลจริง</p><nav class="tabs" aria-label="เลือกเอกสาร"><button data-doc="pr" aria-pressed="true">PR · ใบขอซื้อ</button><button data-doc="po" aria-pressed="false">PO · ใบสั่งซื้อ</button><button data-doc="gr" aria-pressed="false">GR · ใบรับสินค้า</button></nav></div><section class="modal" id="form"></section><p class="notice" id="notice" aria-live="polite">เลือกแท็บด้านบนเพื่อเปรียบเทียบหัวเอกสารทั้งสามใบ</p>
<script>
const field=(id,label,value,kind='text',wide=false)=>`<div class="field ${wide?'wide':''}"><label for="${id}">${label.replace('*','<em>*</em>')}</label>${kind==='select'?`<select id="${id}"><option>${value}</option></select>`:`<input id="${id}" value="${value}" ${kind==='read'?'readonly':`type="${kind}"`}>`}</div>`;
const product='Hot Rolled Steel Sheet<br>(Pickled and Oiled)';
const table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
const configs={
pr:{title:'สร้างใบขอซื้อ (PR)',fields:[['prno','เลขที่ PR','PR26090003','read'],['prdate','วันที่เอกสาร','13/09/2026','read'],['requester','ผู้ขอซื้อ','ผู้ดูแล ระบบ','read'],['department','แผนก','ผลิต','read'],['needed','วันที่ต้องการใช้ *','2026-09-20','date']],bar:'เพิ่มรายการสินค้า',search:'ค้นหารหัส / ชื่อสินค้า',table:table(['ลำดับ','รหัสสินค้า','ประเภท','รายละเอียดสินค้า / บริการ','จำนวน','หน่วย','หมายเหตุ',''],`<tr><td>1</td><td>RM001</td><td>วัตถุดิบ</td><td class="product">${product}</td><td>200</td><td>ชิ้น</td><td>—</td><td><button class="delete">ลบ</button></td></tr><tr><td>2</td><td>RM002</td><td>วัตถุดิบ</td><td class="product">1.2*76*1220 SPCC (16025-851YL-3)</td><td>100</td><td>แผ่น</td><td>—</td><td><button class="delete">ลบ</button></td></tr>`),remark:'วัตถุประสงค์การขอซื้อ',value:'ใช้ในการผลิตตามแผน',summary:'2 รายการ',action:'ส่งอนุมัติ'},
po:{title:'สร้างใบสั่งซื้อ (PO)',fields:[['pono','เลขที่ PO','PO26090003','read'],['podate','วันที่เอกสาร','2026-09-13','date'],['buyer','ผู้จัดซื้อ','ผู้ดูแล ระบบ','select'],['vendor','ผู้ขาย *','บริษัท ตัวอย่างเหล็ก จำกัด','select',true],['delivery','วันที่ส่งมอบ *','2026-09-20','date'],['credit','เครดิตเทอม','30 วัน','select'],['payment','วิธีชำระเงิน','โอนเงิน','select'],['tax','ประเภทภาษี','แยกภาษี','select'],['ship','สถานที่ส่งของ','โรงงานสำนักงานใหญ่','select',true]],bar:'เลือกรายการจาก PR',search:'ค้นหาเลขที่ PR / รายการ',table:table(['ลำดับ','อ้างอิง PR','รหัส','สินค้า / รายการ','จำนวนสั่งซื้อ','หน่วย','ราคา/หน่วย','ส่วนลด','จำนวนเงิน',''],`<tr><td>1</td><td>PR26090003</td><td>RM001</td><td class="product">${product}</td><td>200</td><td>ชิ้น</td><td>350.00</td><td>0.00</td><td>70,000.00</td><td><button class="delete">ลบ</button></td></tr>`),remark:'หมายเหตุถึงผู้ขาย',value:'',summary:'1 รายการ · 74,900.00 บาท',action:'ส่งอนุมัติ'},
gr:{title:'สร้างใบรับสินค้า (GR)',fields:[['grno','เลขที่ GR','GR26090003','read'],['refpo','เลขที่ PO','PO26090003','read'],['grvendor','ผู้ขาย','บริษัท ตัวอย่างเหล็ก จำกัด','read'],['vendorno','เลขที่เอกสารผู้ขาย *','DN-2569-001'],['received','วันที่รับสินค้า *','2026-09-13','date'],['warehouse','คลังรับเข้า *','คลังวัตถุดิบ','select']],table:table(['ลำดับ','รหัส','สินค้า / รายการ','คลังรับเข้า','สั่งซื้อ','ค้างรับ','จำนวนรับ','หน่วย','ราคา/หน่วยสุทธิ','มูลค่ารับเข้า','Lot / Serial'],`<tr><td>1</td><td>RM001</td><td class="product">${product}</td><td><select class="warehouse" aria-label="คลังรับเข้า RM001"><option>คลังวัตถุดิบ</option></select></td><td>200</td><td>200</td><td><input class="qty" aria-label="จำนวนรับ RM001" value="200" readonly></td><td>ชิ้น</td><td>350.00</td><td>70,000.00</td><td><button class="lot">ข้อมูล Lot</button></td></tr>`),remark:'หมายเหตุ',value:'',summary:'1 รายการ · 200 ชิ้น · 70,000.00 บาท',action:'บันทึกการรับสินค้า'}
};
function render(key){const d=configs[key];document.getElementById('form').className='modal '+key;document.getElementById('form').innerHTML=`<header><strong>KRC ERP</strong><h2>${d.title}</h2><small>${key==='gr'?'เลือก PO › รับสินค้า':'ยังไม่บันทึก'}</small></header><main><div class="fields">${d.fields.map(f=>field(...f)).join('')}</div><div class="bar"><h3>รายการสินค้า</h3>${d.search?`<input aria-label="${d.search}" placeholder="${d.search}"><button>${d.bar}</button>`:''}</div>${d.table}<div class="${key==='po'?'bottom':''}"><div class="remark"><label for="remark">${d.remark}</label><input id="remark" value="${d.value}" placeholder="ระบุเพิ่มเติม (ถ้ามี)"></div>${key==='po'?'<div class="totals"><span>รวมก่อนส่วนลด</span><span>70,000.00</span><span>ส่วนลด</span><span>0.00</span><span>ภาษีมูลค่าเพิ่ม 7%</span><span>4,900.00</span><strong>ยอดสุทธิ</strong><strong>74,900.00</strong></div>':''}</div></main><footer><span class="subtle">${key==='gr'?'รับสินค้าตาม PO ที่เลือก':''}</span><span class="summary">${d.summary}</span><button>${key==='gr'?'ย้อนกลับ':'ยกเลิก'}</button>${key!=='gr'?'<button>บันทึกร่าง</button>':''}<button class="primary">${d.action}</button></footer>`;document.querySelectorAll('[data-doc]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.doc===key)));}
document.querySelectorAll('[data-doc]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.doc)));
document.getElementById('form').addEventListener('click',e=>{if(e.target.closest('button'))document.getElementById('notice').textContent='Mockup เท่านั้น — ยังไม่มีการบันทึกหรือเปลี่ยนข้อมูลจริง'});
console.assert(Object.keys(configs).length===3 && configs.pr.fields.length===5 && configs.po.fields.length===9 && configs.gr.fields.length===6,'ครบทั้งสามเอกสารและฟิลด์หัวเอกสาร');render('pr');
</script></html>
