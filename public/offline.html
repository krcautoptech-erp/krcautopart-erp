<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#be0f1a" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ออฟไลน์ | KRC ERP</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f7f7; color: #171717; font-family: system-ui, sans-serif; }
      main { width: min(420px, 100%); padding: 32px; border: 1px solid #ddd; border-top: 4px solid #be0f1a; border-radius: 8px; background: #fff; text-align: center; }
      img { width: 132px; height: auto; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: #555; line-height: 1.6; }
      button { margin-top: 24px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 6px; background: #be0f1a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="KRC ERP" />
      <h1>ไม่พบการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>ข้อมูลธุรกรรมจะไม่ถูกเก็บแบบออฟไลน์ เพื่อป้องกันการแสดงข้อมูลที่ไม่เป็นปัจจุบัน</p>
      <button type="button" onclick="location.reload()">ลองเชื่อมต่ออีกครั้ง</button>
    </main>
  </body>
</html>
